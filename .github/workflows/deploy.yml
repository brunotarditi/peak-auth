name: Test, Build & Deploy

on:
  push:
    branches: [ main ]

concurrency:
  group: deploy-peak-auth-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: peak_test
          POSTGRES_PASSWORD: peak_test_password
          POSTGRES_DB: peak_auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run unit & race tests
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: peak_test
          DB_PASSWORD: peak_test_password
          DB_NAME: peak_auth_test
        run: go test -race ./...

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repository name for GHCR
        id: meta
        run: echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}:latest

      - name: Connect WireGuard Tunnel
        uses: nickvdyck/wireguard-action@v1
        with:
          private-key: ${{ secrets.WG_PRIVATE_KEY }}
          address: ${{ secrets.WG_ADDRESS }}
          peer-public-key: ${{ secrets.WG_PEER_PUBLIC_KEY }}
          peer-endpoint: ${{ secrets.WG_ENDPOINT }}
          allowed-ips: ${{ secrets.DEPLOY_HOST }}/32

      - name: Trigger remote deploy on proxmox
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key \
            -p "$DEPLOY_PORT" \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "${{ github.sha }}"