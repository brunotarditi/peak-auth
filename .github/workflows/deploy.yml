name: Test, Build & Deploy

on:
  push:
    branches: [ main ]

concurrency:
  group: deploy-peak-auth-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: peak_test
          POSTGRES_PASSWORD: peak_test_password
          POSTGRES_DB: peak_auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run unit & race tests
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: peak_test
          DB_PASSWORD: peak_test_password
          DB_NAME: peak_auth_test
        run: go test -race ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Lowercase repository name for GHCR
        id: meta
        run: echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Connect WireGuard and trigger remote deploy
        env:
          WG_PRIVATE_KEY: ${{ secrets.WG_PRIVATE_KEY }}
          WG_ADDRESS: ${{ secrets.WG_ADDRESS }}
          WG_PEER_PUBLIC_KEY: ${{ secrets.WG_PEER_PUBLIC_KEY }}
          WG_ENDPOINT: ${{ secrets.WG_ENDPOINT }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq wireguard-tools

          WG_PRIVATE_KEY=$(printf '%s' "$WG_PRIVATE_KEY" | tr -d '[:space:]')
          WG_ADDRESS=$(printf '%s' "$WG_ADDRESS" | tr -d '[:space:]')
          WG_PEER_PUBLIC_KEY=$(printf '%s' "$WG_PEER_PUBLIC_KEY" | tr -d '[:space:]')
          WG_ENDPOINT=$(printf '%s' "$WG_ENDPOINT" | tr -d '[:space:]')
          DEPLOY_HOST=$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]')
          DEPLOY_PORT=$(printf '%s' "$DEPLOY_PORT" | tr -d '[:space:]')
          DEPLOY_USER=$(printf '%s' "$DEPLOY_USER" | tr -d '[:space:]')

          sudo mkdir -p /etc/wireguard
          sudo install -m 600 /dev/null /etc/wireguard/wg.key
          printf '%s' "$WG_PRIVATE_KEY" | sudo tee /etc/wireguard/wg.key >/dev/null

          sudo ip link add dev wg0 type wireguard
          sudo ip address add "$WG_ADDRESS" dev wg0
          sudo wg set wg0 \
            private-key /etc/wireguard/wg.key \
            peer "$WG_PEER_PUBLIC_KEY" \
            endpoint "$WG_ENDPOINT" \
            allowed-ips "${DEPLOY_HOST}/32" \
            persistent-keepalive 25
          sudo rm -f /etc/wireguard/wg.key

          sudo ip link set mtu 1420 up dev wg0
          sudo ip route replace "${DEPLOY_HOST}/32" dev wg0

          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          ssh \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=2 \
            -o BatchMode=yes \
            -i ~/.ssh/deploy_key \
            -p "$DEPLOY_PORT" \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "${{ github.sha }}"