{{ define "partials/footer_admin" }}
<footer style="background-color: transparent; border-top: 1px solid var(--border-light); padding: 2rem 0; margin-top: auto;">
    <div class="container" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; color: var(--text-muted); font-size: 0.875rem;">
        <div style="display: flex; align-items: center; gap: 0.5rem;">
            <span style="font-weight: 700; color: var(--text-main);">Peak Auth</span>
            <span>&bull;</span>
            <p>&copy; {{ now.Year }} Gestión de Identidades en la Nube.</p>
        </div>
        <div style="display: flex; gap: 1.5rem;">
            <a href="/admin/docs" style="color: var(--text-muted); text-decoration: none; transition: color 0.2s;" onmouseover="this.style.color='var(--brand-500)'" onmouseout="this.style.color='var(--text-muted)'">Documentación</a>
            <a href="/admin/docs/api" style="color: var(--text-muted); text-decoration: none; transition: color 0.2s;" onmouseover="this.style.color='var(--brand-500)'" onmouseout="this.style.color='var(--text-muted)'">API</a>
        </div>
    </div>
</footer>
{{ end }}
