{{ define "oauth_login.html" }}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión con Peak Auth</title>
    <!-- Vanilla CSS -->
    <link rel="stylesheet" href="/static/css/main.css">
    <script src="/static/js/common.js"></script>
</head>

<body class="layout-auth">
    <!-- Fondos dinámicos -->
    <div class="auth-bg-shapes">
        <div class="auth-blob-1"></div>
        <div class="auth-blob-2"></div>
    </div>

    <!-- Contenedor Principal -->
    <div class="auth-container">
        <!-- Logo -->
        <div style="text-align: center; margin-bottom: 2rem;">
            <div class="navbar-logo-wrapper" style="display: inline-flex; padding: 0.75rem; border-radius: 1rem; background: var(--bg-surface); box-shadow: var(--shadow-md); border: 1px solid var(--border-color); margin-bottom: 1rem;">
                <img src="/static/img/logo.svg" alt="Peak Auth" style="width: 2.5rem; height: 2.5rem;">
            </div>
            <h1 class="peak-card-title" style="font-size: 1.875rem;">Iniciar Sesión</h1>
            <p class="peak-card-subtitle" style="font-size: 0.875rem; font-weight: 500;">Continuar hacia la aplicación solicitante</p>
        </div>

        <!-- Tarjeta del Formulario -->
        <div class="glass-panel">
            {{ if .Error }}
            <div class="alert-error">
                <svg style="width: 1.25rem; height: 1.25rem; flex-shrink: 0;" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" /></svg>
                <span>{{ .Error }}</span>
            </div>
            {{ end }}

            <form action="/oauth/login" method="POST" style="display: flex; flex-direction: column; gap: 1.25rem;">
                <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
                <input type="hidden" name="client_id" value="{{ .ClientID }}">
                <input type="hidden" name="redirect_uri" value="{{ .RedirectURI }}">
                <input type="hidden" name="state" value="{{ .State }}">
                <input type="hidden" name="code_challenge" value="{{ .CodeChallenge }}">
                <input type="hidden" name="code_challenge_method" value="{{ .CodeChallengeMethod }}">

                <div class="form-group">
                    <label class="form-label">Correo Electrónico</label>
                    <input type="email" name="email" required placeholder="tu@correo.com" class="peak-input">
                </div>

                <div class="form-group">
                    <label class="form-label">Contraseña</label>
                    <input type="password" name="password" required placeholder="••••••••" class="peak-input">
                </div>

                <button type="submit" class="peak-btn peak-btn-primary peak-btn-block">
                    Entrar de forma segura
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>
                </button>
            </form>
        </div>

        <p style="text-align: center; color: var(--text-muted);" style="font-size: 0.75rem; font-weight: 600; margin-top: 2rem;">
            Secured by Peak Auth SSO
        </p>
    </div>
</body>

</html>
{{ end }}
