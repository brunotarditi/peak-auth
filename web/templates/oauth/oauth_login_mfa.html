{{ define "oauth_login_mfa.html" }}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de Seguridad - Peak Auth</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/main.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/static/js/common.js"></script>
</head>

<body class="bg-pattern layout-auth">
    <div class="auth-bg-shapes">
        <div class="auth-blob-1"></div>
        <div class="auth-blob-2"></div>
    </div>

    <div class="auth-container" style="animation: slide-in-right 0.3s ease-out;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="display: inline-flex; align-items: center; justify-content: center; padding: 0.75rem; border-radius: 1rem; background-color: var(--bg-surface); box-shadow: var(--shadow-md); margin-bottom: 1rem; border: 1px solid var(--border-light);">
                <img src="/static/img/logo.svg" alt="Peak Auth" style="width: 2.5rem; height: 2.5rem;">
            </div>
            <h1 style="font-size: 1.875rem; font-weight: 900; letter-spacing: -0.025em; color: var(--text-main);">Verificación</h1>
            <p style="color: var(--text-muted); margin-top: 0.5rem; font-size: 0.875rem; font-weight: 500;">Confirma tu identidad para continuar</p>
        </div>

        <div class="glass-panel" style="padding: 2.5rem 2rem;">
            <div id="totp-container">
                <h3 style="font-size: 0.875rem; font-weight: 700; color: var(--text-main); margin-bottom: 1rem; text-align: center;">Ingresa el código de tu Authenticator</h3>
                <input type="text" id="totp-code"
                    class="peak-input"
                    style="text-align: center; font-size: 1.5rem; letter-spacing: 0.5em; font-family: monospace; margin-bottom: 1rem; padding: 1rem;"
                    placeholder="••••••" maxlength="6" autocomplete="one-time-code" autofocus>

                <button onclick="verifyTotp()" id="totp-btn" class="peak-btn peak-btn-primary peak-btn-block" style="padding: 1rem; margin-bottom: 1rem; display: flex; justify-content: center;">
                    <span>Verificar Código</span>
                </button>
            </div>

            <div style="position: relative; margin: 1.5rem 0;">
                <div style="position: absolute; inset: 0; display: flex; align-items: center;">
                    <div style="width: 100%; border-top: 1px solid var(--border-color);"></div>
                </div>
                <div style="position: relative; display: flex; justify-content: center; font-size: 0.75rem;">
                    <span style="background-color: var(--bg-surface); padding: 0 1rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase;">o usa</span>
                </div>
            </div>

            <button onclick="loginWebAuthn()" class="peak-btn peak-btn-secondary peak-btn-block" style="padding: 1rem; display: flex; justify-content: center; align-items: center; gap: 0.75rem;">
                <svg style="width: 1.25rem; height: 1.25rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path></svg>
                <span>Llave de Seguridad (Passkey)</span>
            </button>
        </div>
    </div>

    <!-- Hidden form for redirect -->
    <form id="redirect-form" action="/oauth/authorize" method="GET" style="display: none;">
        <input type="hidden" name="client_id" value="{{ .ClientID }}">
        <input type="hidden" name="redirect_uri" value="{{ .RedirectURI }}">
        <input type="hidden" name="response_type" value="code">
        <input type="hidden" name="state" value="{{ .State }}">
    </form>

    <script>
        const mfaToken = "{{ .MfaToken }}";
        const clientID = "{{ .ClientID }}";

        function setCookie(name, value, minutes) {
            let expires = "";
            if (minutes) {
                let date = new Date();
                date.setTime(date.getTime() + (minutes * 60 * 1000));
                expires = "; expires=" + date.toUTCString();
            }
            document.cookie = name + "=" + (value || "")  + expires + "; path=/; samesite=lax";
        }

        async function verifyTotp() {
            const code = document.getElementById('totp-code').value;
            if (!code || code.length !== 6) {
                Swal.fire('Error', 'Ingresa el código de 6 dígitos', 'error');
                return;
            }

            try {
                const res = await fetch('/api/v1/login/mfa/totp', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'X-App-ID': clientID
                    },
                    body: JSON.stringify({ mfa_token: mfaToken, code: code })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Código incorrecto');

                if (data.access_token) {
                    setCookie('peak_session', data.access_token, data.expires_in / 60);
                    document.getElementById('redirect-form').submit();
                }

            } catch (err) {
                Swal.fire('Error', err.message, 'error');
            }
        }

        async function loginWebAuthn() {
            try {
                const res = await fetch('/api/v1/login/mfa/webauthn/begin?mfa_token=' + mfaToken, {
                    headers: { 'X-App-ID': clientID }
                });
                if (!res.ok) throw new Error('Error al iniciar WebAuthn');
                
                const options = await res.json();
                
                options.publicKey.challenge = base64urlToBuffer(options.publicKey.challenge);
                if (options.publicKey.allowCredentials) {
                    options.publicKey.allowCredentials.forEach(cred => {
                        cred.id = base64urlToBuffer(cred.id);
                    });
                }

                const assertion = await navigator.credentials.get({ publicKey: options.publicKey });
                
                const assertionResponse = {
                    id: assertion.id,
                    rawId: bufferToBase64url(assertion.rawId),
                    type: assertion.type,
                    response: {
                        authenticatorData: bufferToBase64url(assertion.response.authenticatorData),
                        clientDataJSON: bufferToBase64url(assertion.response.clientDataJSON),
                        signature: bufferToBase64url(assertion.response.signature),
                        userHandle: assertion.response.userHandle ? bufferToBase64url(assertion.response.userHandle) : null
                    }
                };

                const finishRes = await fetch('/api/v1/login/mfa/webauthn/finish', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'X-App-ID': clientID
                    },
                    body: JSON.stringify({ mfa_token: mfaToken, assertion: assertionResponse })
                });
                
                const finishData = await finishRes.json();
                if (!finishRes.ok) throw new Error(finishData.error || 'Fallo de WebAuthn');
                
                if (finishData.access_token) {
                    setCookie('peak_session', finishData.access_token, finishData.expires_in / 60);
                    document.getElementById('redirect-form').submit();
                }

            } catch (err) {
                console.error(err);
                Swal.fire('Error', err.message, 'error');
            }
        }

        function bufferToBase64url(buffer) {
            const bytes = new Uint8Array(buffer);
            let str = '';
            for (let charCode of bytes) str += String.fromCharCode(charCode);
            const base64String = btoa(str);
            return base64String.replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
        }

        function base64urlToBuffer(base64url) {
            const padding = '='.repeat((4 - base64url.length % 4) % 4);
            const base64 = (base64url + padding).replace(/\-/g, '+').replace(/_/g, '/');
            const rawData = atob(base64);
            const buffer = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) buffer[i] = rawData.charCodeAt(i);
            return buffer.buffer;
        }
    </script>
<script src="{{ js "login_mfa.js" }}"></script>`n</body>
</html>
{{ end }}
