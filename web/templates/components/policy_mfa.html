{{ define "components/policy_mfa" }}
<div id="content_mfa" class="tab-content hidden phase8-style-97">
    <div class="phase8-style-98">
        <div>
            <h3 class="phase8-style-99">Autenticación en dos pasos (MFA)</h3>
            <p class="phase8-style-100">Configura el requisito de segundo factor (TOTP) para esta aplicación.</p>
        </div>
        {{ if ne .App.AppID "peak-auth" }}
        <button type="button" data-action="toggle-edit" data-section="mfa" id="btn_edit_mfa" class="peak-btn peak-btn-secondary phase8-style-101">
            <span>Editar</span>
            <svg class="phase8-style-102" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
        </button>
        {{ end }}
    </div>

    <fieldset id="fs_mfa" disabled class="phase8-style-103">
        <div class="phase8-style-104">
            <!-- Política de MFA -->
            <div class="phase8-style-105">
                <div class="phase8-style-106">
                    <span class="phase8-style-107">Modo de verificación</span>
                    <span class="phase8-style-108">
                        Determina si el inicio de sesión exige un segundo factor.
                    </span>
                </div>
                <div class="phase8-style-117 group">
                    <select id="mfa_mode" data-policy="mfa" class="peak-input phase8-style-118">
                        <option value="OPTIONAL" {{ if eq .MfaPolicy.Mode "OPTIONAL" }}selected{{ end }}>OPCIONAL (Si el usuario lo activa)</option>
                        <option value="REQUIRED" {{ if eq .MfaPolicy.Mode "REQUIRED" }}selected{{ end }}>REQUERIDO (Para todos)</option>
                        <option value="DISABLED" {{ if eq .MfaPolicy.Mode "DISABLED" }}selected{{ end }}>DESHABILITADO</option>
                    </select>
                </div>
            </div>
        </div>
    </fieldset>
</div>
{{ end }}
