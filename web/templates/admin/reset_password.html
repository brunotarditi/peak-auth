<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peak Auth - Establecer Contraseña</title>
    <script src="{{ js " config.js" }}"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ asset " /static/css/main.css" }}">
    <script src="{{ js " modal.js" }}"></script>
    <script src="{{ js " common.js" }}"></script>
    <link rel="icon" type="image/png" href="{{ asset " /static/img/favicon.png" }}">
</head>

<body class="bg-pattern layout-auth">
    <div class="auth-bg-shapes">
        <div class="auth-blob-1"></div>
        <div class="auth-blob-2"></div>
    </div>

    <div class="auth-container auth-container-animated-bottom">
        <div class="auth-brand auth-brand-compact">
            <div class="auth-logo-mark">
                <img src="{{ asset " /static/img/logo.svg" }}" alt="Peak Auth">
            </div>
            {{ if .IsExpired }}
            <h1 class="auth-title auth-title-small">Contraseña <span class="auth-title-danger">Expirada</span></h1>
            <p class="auth-subtitle auth-subtitle-small">Tu contraseña ha expirado. Por favor ingresa una nueva para
                continuar.</p>
            {{ else }}
            <h1 class="auth-title auth-title-small">Activa tu <span class="auth-title-accent">Cuenta</span></h1>
            <p class="auth-subtitle auth-subtitle-small">Establece tu contraseña para comenzar</p>
            {{ end }}
        </div>

        <div class="glass-panel auth-panel">
            <form id="resetForm" class="auth-form">
                <input type="hidden" name="token" id="reset_token" value="{{ .token }}">

                <div class="form-group auth-form-group">
                    <label for="password_field" class="auth-label">Nueva Contraseña</label>
                    <div class="auth-password-wrapper">
                        <input type="password" name="password" id="password_field" required minlength="4"
                            placeholder="••••••••" class="peak-input auth-input-password">
                        <button type="button" data-action="toggle-password" data-target="password_field"
                            aria-label="Mostrar u ocultar contraseña" class="icon-btn auth-password-toggle">
                            {{template "icon-eye"}}
                        </button>
                    </div>
                </div>

                <div class="form-group auth-form-group">
                    <label for="confirm_password_field" class="auth-label">Confirmar Contraseña</label>
                    <div class="auth-password-wrapper">
                        <input type="password" name="confirm_password" id="confirm_password_field" required
                            minlength="4" placeholder="••••••••" class="peak-input auth-input-password">
                        <button type="button" data-action="toggle-password" data-target="confirm_password_field"
                            aria-label="Mostrar u ocultar contraseña" class="icon-btn auth-password-toggle">
                            {{template "icon-eye"}}
                        </button>
                    </div>
                </div>

                <button type="submit" class="peak-btn peak-btn-primary peak-btn-block auth-form-button">
                    <span>{{ if .IsExpired }}Actualizar y Continuar{{ else }}Activar y Entrar{{ end }}</span>
                    {{template "icon-check-circle"}}
                </button>
            </form>
        </div>
    </div>

    <script src="{{ js " reset-password.js" }}"></script>
</body>

</html>
