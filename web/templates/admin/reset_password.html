<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peak Auth - Establecer Contraseña</title>
    <script src="{{ js "config.js" }}"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ asset "/static/css/main.css" }}">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="{{ js "common.js" }}"></script>
    <link rel="icon" type="image/png" href="{{ asset "/static/img/favicon.png" }}">
</head>

<body class="bg-pattern layout-auth">
    <div class="auth-bg-shapes">
        <div class="auth-blob-1"></div>
        <div class="auth-blob-2"></div>
    </div>

    <div class="auth-container" style="animation: slide-in-bottom 0.4s cubic-bezier(0.16, 1, 0.3, 1);">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="display: inline-flex; align-items: center; justify-content: center; padding: 0.75rem; border-radius: 1rem; background-color: var(--bg-surface); box-shadow: var(--shadow-md); margin-bottom: 1rem; border: 1px solid var(--border-light);">
                <img src="{{ asset "/static/img/logo.svg" }}" alt="Peak Auth" style="width: 2.5rem; height: 2.5rem;">
            </div>
            <h1 style="font-size: 1.875rem; font-weight: 900; letter-spacing: -0.025em; color: var(--text-main);">Activa tu <span style="color: var(--brand-600);">Cuenta</span></h1>
            <p style="color: var(--text-muted); margin-top: 0.5rem; font-size: 0.875rem; font-weight: 500;">Establece tu contraseña para comenzar</p>
        </div>

        <div class="glass-panel" style="padding: 2.5rem 2rem;">
            <form id="resetForm" onsubmit="handleReset(event)" style="display: flex; flex-direction: column; gap: 1.5rem;">
                <input type="hidden" name="token" id="reset_token" value="{{ .token }}">

                <div class="form-group mb-0">
                    <label style="display: block; font-size: 0.625rem; font-weight: 900; color: var(--slate-400); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.75rem;">Nueva Contraseña</label>
                    <div style="position: relative;">
                        <input type="password" name="password" id="password_field" required minlength="4" placeholder="••••••••" class="peak-input" style="padding-right: 3rem;">
                        <button type="button" onclick="toggleLoginPassword('password_field')" class="icon-btn" style="position: absolute; right: 0.5rem; top: 50%; transform: translateY(-50%);">
                            {{template "icon-eye"}}
                        </button>
                    </div>
                </div>

                <div class="form-group mb-0">
                    <label style="display: block; font-size: 0.625rem; font-weight: 900; color: var(--slate-400); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.75rem;">Confirmar Contraseña</label>
                    <div style="position: relative;">
                        <input type="password" name="confirm_password" id="confirm_password_field" required minlength="4" placeholder="••••••••" class="peak-input" style="padding-right: 3rem;">
                        <button type="button" onclick="toggleLoginPassword('confirm_password_field')" class="icon-btn" style="position: absolute; right: 0.5rem; top: 50%; transform: translateY(-50%);">
                            {{template "icon-eye"}}
                        </button>
                    </div>
                </div>

                <button type="submit" class="peak-btn peak-btn-primary peak-btn-block" style="padding: 1rem; display: flex; justify-content: center; align-items: center; gap: 0.75rem; margin-top: 0.5rem;">
                    <span>Activar y Entrar</span>
                    {{template "icon-check-circle"}}
                </button>
            </form>
        </div>
    </div>

    <script>
        async function handleReset(e) {
            e.preventDefault();
            const token = document.getElementById('reset_token').value;
            const password = document.getElementById('password_field').value;
            const confirmPassword = document.getElementById('confirm_password_field').value;

            if (password !== confirmPassword) {
                Swal.fire({
                    icon: 'error',
                    title: 'Las contraseñas no coinciden',
                    text: 'Por favor, verifica e intenta de nuevo'
                });
                return;
            }

            try {
                const response = await fetch('/admin/password/reset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });

                if (response.ok) {
                    Swal.fire({
                        icon: 'success',
                        title: '¡Contraseña establecida!',
                        text: 'Redirigiendo...',
                        showConfirmButton: false,
                        timer: 1500
                    }).then(() => {
                        window.location.href = '/admin/';
                    });
                } else {
                    const data = await response.json();
                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: data.error || 'No se pudo establecer la contraseña'
                    });
                }
            } catch (error) {
                console.error(error);
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: 'Error de conexión'
                });
            }
        }
    </script>
</body>

</html>
