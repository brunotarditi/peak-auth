<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración de Seguridad - Peak Auth</title>
    <script src="{{ js "config.js" }}"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ asset "/static/css/main.css" }}">
    <script src="{{ js "modal.js" }}"></script>
    <script src="{{ js "common.js" }}"></script>
    <link rel="icon" type="image/png" href="{{ asset "/static/img/favicon.png" }}">
</head>

<body class="bg-pattern layout-auth">
    <div class="auth-bg-shapes">
        <div class="auth-blob-1"></div>
        <div class="auth-blob-2"></div>
    </div>

    <div class="auth-container auth-container-animated">
        <div class="auth-brand auth-brand-compact">
            <div class="auth-logo-mark">
                <img src="{{ asset "/static/img/logo.svg" }}" alt="Peak Auth">
            </div>
            <h1 class="auth-title auth-title-small">Acceso restringido</h1>
            <p class="auth-subtitle auth-subtitle-small">Por política de seguridad, debes configurar el segundo factor (MFA) obligatoriamente antes de continuar.</p>
        </div>

        <div class="glass-panel auth-panel auth-panel-compact">
            {{ if .Error }}
            <div class="auth-error">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                <span>{{ .Error }}</span>
            </div>
            {{ end }}

            <div id="totp-setup-container" class="auth-totp">
                <h3 class="auth-step-title">1. App de autenticación</h3>
                <p class="auth-step-copy">Escanea el código QR con Google Authenticator o Authy.</p>
                <div id="qr-code-box" class="auth-qr-box">
                    <div class="auth-muted">Cargando QR...</div>
                </div>
                
                <input type="text" id="totp-code" name="code" required
                    class="auth-totp-input"
                    placeholder="000 000" autocomplete="off" maxlength="6">

                <button type="button" data-action="verify-totp" class="peak-btn peak-btn-primary peak-btn-block auth-icon-button">
                    <span>Verificar y Entrar</span>
                </button>
            </div>

            <div class="auth-divider">
                <div class="auth-divider-line">
                    <div></div>
                </div>
                <div class="auth-divider-label">
                    <span class="auth-divider-label-strong">o usar</span>
                </div>

                <button type="button" id="btn-webauthn-register" class="peak-btn peak-btn-secondary peak-btn-block auth-icon-button">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4" /></svg>
                    <span>Registrar Llave de Seguridad (Passkey)</span>
                </button>
            </div>

            <!-- Recovery Codes Modal triggers when successful -->
        </div>
    </div>

    <!-- Modales y scripts -->
    <script src="{{ js "login_mfa_setup.js" }}"></script>
</body>

</html>
