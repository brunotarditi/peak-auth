<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peak Auth - Verificación MFA</title>
    <script src="{{ js "config.js" }}"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ asset "/static/css/main.css" }}">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="{{ js "common.js" }}"></script>
    <link rel="icon" type="image/png" href="{{ asset "/static/img/favicon.png" }}">
</head>

<body class="bg-pattern layout-auth">
    <div class="auth-bg-shapes">
        <div class="auth-blob-1"></div>
        <div class="auth-blob-2"></div>
    </div>

    <div class="auth-container" style="animation: slide-in-right 0.3s ease-out;">
        <div style="text-align: center; margin-bottom: 2.5rem;">
            <img src="{{ asset "/static/img/logo.svg" }}" alt="Peak Auth" style="height: 4rem; margin: 0 auto 1rem;">
            <h1 style="font-size: 2.25rem; font-weight: 900; letter-spacing: -0.025em; color: var(--text-main);">Peak <span style="color: var(--brand-600);">Auth</span></h1>
            <p style="color: var(--text-muted); margin-top: 0.5rem; font-weight: 500;">Verificación de Doble Factor</p>
        </div>

        <div class="glass-panel">
            <h2 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 1rem; color: var(--text-main);">Seguridad de la Cuenta</h2>
            <p style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 2rem; font-weight: 500; line-height: 1.625;">
                Su cuenta está protegida con verificación de doble factor. Ingrese el código de su aplicación authenticator o un código de recuperación.
            </p>

            {{ if .Error }}
            <div style="margin-bottom: 1.5rem; padding: 1rem; background-color: var(--rose-50); border: 1px solid var(--rose-100); border-radius: var(--radius-xl); display: flex; align-items: center; gap: 0.75rem; color: var(--rose-600); font-size: 0.75rem; font-weight: 700;">
                <svg style="width: 1.25rem; height: 1.25rem; flex-shrink: 0;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
                <span>{{ .Error }}</span>
            </div>
            {{ end }}

            <form action="/admin/login/mfa" method="POST" style="display: flex; flex-direction: column; gap: 1.5rem;">
                <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
                <input type="hidden" name="mfa_token" value="{{ .MfaToken }}">
                
                <div style="margin-bottom: 0;" class="form-group">
                    <label style="display: block; font-size: 0.625rem; font-weight: 900; color: var(--slate-400); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.75rem;">Código de Seguridad</label>
                    <input type="text" name="code" required autocomplete="one-time-code" placeholder="000000 o XXXX-XXXX" autofocus class="peak-input" style="padding: 1rem 1.25rem; font-family: monospace; text-align: center; font-size: 1.25rem; letter-spacing: 0.1em; font-weight: 700;">
                </div>

                <button type="submit" class="peak-btn peak-btn-primary peak-btn-block" style="padding: 1rem; display: flex; justify-content: center; align-items: center; gap: 0.75rem;">
                    <span>Verificar y Entrar</span>
                    {{template "icon-arrow-forward"}}
                </button>
            </form>

            {{ if .HasWebAuthn }}
            <div style="margin-top: 1.5rem;">
                <div style="position: relative; margin-bottom: 1.5rem;">
                    <div style="position: absolute; inset: 0; display: flex; align-items: center;">
                        <div style="width: 100%; border-top: 1px solid var(--border-color);"></div>
                    </div>
                    <div style="position: relative; display: flex; justify-content: center; font-size: 0.75rem;">
                        <span style="background-color: var(--bg-surface); padding: 0 1rem; color: var(--text-muted); font-weight: 500;">o utiliza</span>
                    </div>
                </div>

                <button type="button" id="btn-webauthn" class="peak-btn peak-btn-secondary peak-btn-block" style="padding: 1rem;">
                    <svg style="width: 1.25rem; height: 1.25rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4" /></svg>
                    <span>Llave de Seguridad (Passkey)</span>
                </button>
            </div>
            {{ end }}
        </div>
    </div>
<script src="{{ js "login_mfa.js" }}"></script>`n</body>

</html>
