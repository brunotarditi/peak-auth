<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peak Auth - Confirmar Verificación</title>
    <script src="{{ js "config.js" }}"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ asset "/static/css/main.css" }}">
    <link rel="icon" type="image/png" href="{{ asset "/static/img/favicon.png" }}">
</head>

<body class="bg-pattern layout-auth">
    <div class="auth-bg-shapes">
        <div class="auth-blob-1"></div>
        <div class="auth-blob-2"></div>
    </div>

    <div class="auth-container auth-container-animated">
        <div class="glass-panel auth-panel auth-panel-centered">
            <div class="auth-logo-mark auth-logo-mark-large">
                <img src="{{ asset "/static/img/logo.svg" }}" alt="Peak Auth">
            </div>

            <h1 class="auth-title auth-title-small auth-title-margin">Verificar tu <span class="auth-title-success">Email</span></h1>
            
            <p class="auth-result-copy">
                Haz clic en el botón de abajo para confirmar tu dirección de correo electrónico y activar tu cuenta.
            </p>

            <form method="POST" action="/verify" class="auth-result-form">
                <input type="hidden" name="token" value="{{ .Token }}">
                <input type="hidden" name="csrf_token" value="{{ .csrf_token }}">
                <button type="submit" class="peak-btn peak-btn-primary peak-btn-block auth-success-link">
                    <span>Verificar Email</span>
                    {{template "icon-forward"}}
                </button>
            </form>
        </div>

        <p class="auth-footer-note">
            Peak Auth Security Protocol
        </p>
    </div>
</body>

</html>
