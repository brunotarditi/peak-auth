<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peak Auth - Acceso Admin</title>
    <script src="{{ js "config.js" }}"></script>
    <link rel="stylesheet" href="{{ asset "/static/css/main.css" }}">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="{{ js "login.js" }}"></script>
    <script src="{{ js "common.js" }}"></script>
    <link rel="icon" type="image/png" href="{{ asset "/static/img/favicon.png" }}">
</head>

<body class="layout-auth bg-pattern">
    <div class="auth-container" style="max-width: 28rem;">
        <div style="text-align: center; margin-bottom: 2.5rem;">
            <img src="{{ asset "/static/img/logo.svg" }}" alt="Peak Auth" style="height: 4rem; margin: 0 auto 1rem;">
            <h1 style="font-size: 2.25rem; font-weight: 900; letter-spacing: -0.025em; color: var(--text-main);">Peak <span style="color: var(--brand-600);">Auth</span></h1>
            <p style="color: var(--text-muted); margin-top: 0.5rem; font-weight: 500;">Panel de Control de Identidad</p>
        </div>

        <div class="peak-card" style="padding: 2.5rem;">
            <h2 class="peak-card-title" style="margin-bottom: 2rem;">Bienvenido al Panel</h2>

            <form action="/admin/login" method="POST" style="display: flex; flex-direction: column; gap: 1.5rem;">
                <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
                <div class="form-group" style="margin: 0;">
                    <label class="form-label">Email Administrador</label>
                    <input type="email" name="email" required placeholder="admin@ejemplo.com" class="peak-input">
                </div>

                <div class="form-group" style="margin: 0;">
                    <label class="form-label">Contraseña</label>
                    <div style="position: relative;">
                        <input type="password" name="password" id="password_field" required placeholder="••••••••" class="peak-input" style="padding-right: 3rem;">
                        <button type="button" onclick="toggleLoginPassword('password_field')" style="position: absolute; right: 0; top: 0; bottom: 0; padding: 0 1rem; color: var(--text-muted); background: transparent; border: none; cursor: pointer;">
                            {{template "icon-eye"}}
                        </button>
                    </div>
                </div>

                <button type="submit" class="peak-btn peak-btn-primary peak-btn-block" style="padding: 1rem; margin-top: 0.5rem;">
                    <span>Entrar al Panel</span>
                    {{template "icon-arrow-forward"}}
                </button>
            </form>

            <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border-light); text-align: center;">
                <a href="/admin/reset-password" style="font-size: 0.75rem; font-weight: 700; color: var(--brand-600); text-decoration: none;">¿Olvidaste tu contraseña?</a>
            </div>
        </div>
    </div>
</body>

</html>
