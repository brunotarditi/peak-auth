<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peak Auth - Acceso Admin</title>
    <script src="{{ js " config.js" }}"></script>
    <link rel="stylesheet" href="{{ asset " /static/css/main.css" }}">
    <script src="{{ js " modal.js" }}"></script>
    <script src="{{ js " common.js" }}"></script>
    <script src="{{ js " login.js" }}"></script>
    <link rel="icon" type="image/png" href="{{ asset " /static/img/favicon.png" }}">
</head>

<body class="layout-auth bg-pattern">
    <div class="auth-container auth-container-wide">
        <div class="auth-brand">
            <img src="{{ asset " /static/img/logo.svg" }}" alt="Peak Auth" class="auth-logo">
            <h1 class="auth-title">Peak <span class="auth-title-accent">Auth</span></h1>
            <p class="auth-subtitle">Panel de control de identidad</p>
        </div>

        <div class="peak-card auth-panel">
            <h2 class="peak-card-title mb-8">Bienvenido al panel</h2>

            <form action="/admin/login" method="POST" class="auth-form">
                <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
                <div class="form-group auth-form-group">
                    <label class="form-label" for="login_email">Email de administrador</label>
                    <input type="email" id="login_email" name="email" required placeholder="admin@ejemplo.com"
                        class="peak-input">
                </div>

                <div class="form-group auth-form-group">
                    <label class="form-label" for="password_field">Contraseña</label>
                    <div class="auth-password-wrapper">
                        <input type="password" name="password" id="password_field" required placeholder="••••••••"
                            class="peak-input auth-input-password">
                        <button type="button" data-action="toggle-password" data-target="password_field"
                            aria-label="Mostrar u ocultar contraseña" class="auth-password-toggle icon-btn">
                            {{template "icon-eye"}}
                        </button>
                    </div>
                </div>

                <button type="submit" class="peak-btn peak-btn-primary peak-btn-block auth-form-button">
                    <span>Entrar al panel</span>
                    {{template "icon-arrow-forward"}}
                </button>
            </form>

            <div class="auth-help">
                <a href="/admin/login" data-action="admin-password-help">¿Olvidaste tu contraseña?</a>
            </div>
        </div>
    </div>
</body>

</html>
