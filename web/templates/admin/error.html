{{ define "content" }}
<div class="phase8-style-70">
    <div class="phase8-style-71">
        <div class="phase8-style-72"></div>
        <div class="phase8-style-73">
            <svg class="phase8-style-74" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z">
                </path>
            </svg>
        </div>
    </div>

    <h1 class="phase8-style-13">¡Algo salió mal!</h1>

    <div class="phase8-style-75">
        "{{ if .Message }}{{ .Message }}{{ else }}{{ .error }}{{ end }}"
    </div>

    <div class="phase8-style-76">
        <a href="/admin" class="peak-btn peak-btn-primary phase8-style-77">
            {{template "icon-arrow-back"}}
            <span>Volver a aplicaciones</span>
        </a>
        <button data-action="reload-page" class="peak-btn peak-btn-secondary phase8-style-78">
            <span>Reintentar</span>
        </button>
    </div>
</div>
{{ end }}
{{ define "scripts" }} {{ end }}
